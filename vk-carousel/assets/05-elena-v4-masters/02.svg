<svg xmlns="http://www.w3.org/2000/svg" width="1086" height="1448" viewBox="0 0 1086 1448"><title>Елена v4 · 2/7</title><g id="background"><rect width="1086" height="1448" fill="#E1E3DF"/></g><g id="headline"><text x="76" y="132" font-family="Open Sans" font-size="68" font-weight="700" fill="#111511">Ответила.</text><text x="76" y="224" font-family="Open Sans" font-size="68" font-weight="700" fill="#111511">Тут ещё один чат.</text></g><g id="body-text"><text x="76" y="314" font-family="Open Sans" font-size="38" font-weight="400" fill="#111511">Первый вопрос закрыт. В соседнем чате коллеги</text><text x="76" y="368" font-family="Open Sans" font-size="38" font-weight="400" fill="#111511">обсуждают новость, и Елене хочется включиться.</text><text x="76" y="422" font-family="Open Sans" font-size="38" font-weight="400" fill="#111511">Ещё пара ответов — и можно возвращаться.</text></g><g id="interfaces"><rect x="78" y="645" width="405" height="280" rx="24" fill="#F5F6F7"/><text x="106" y="693" font-family="Open Sans" font-size="29" font-weight="600" fill="#111511">Непрочитанные</text><path d="M108 733 h48 v34 h-27 l-13 12 v-12 h-8 z" fill="#006DFF"/><text x="176" y="757" font-family="Open Sans" font-size="28" font-weight="400" fill="#111511">Рабочий чат</text><circle cx="438" cy="746" r="20" fill="#006DFF"/><text x="426" y="755" font-family="Open Sans" font-size="22" font-weight="600" fill="white">12</text><path d="M108 802 h48 v34 h-27 l-13 12 v-12 h-8 z" fill="#006DFF"/><text x="176" y="826" font-family="Open Sans" font-size="28" font-weight="400" fill="#111511">Коллеги</text><circle cx="438" cy="815" r="20" fill="#006DFF"/><text x="426" y="824" font-family="Open Sans" font-size="22" font-weight="600" fill="white">4</text><path d="M108 871 h48 v34 h-27 l-13 12 v-12 h-8 z" fill="#006DFF"/><text x="176" y="895" font-family="Open Sans" font-size="28" font-weight="400" fill="#111511">Личное</text><circle cx="438" cy="884" r="20" fill="#006DFF"/><text x="426" y="893" font-family="Open Sans" font-size="22" font-weight="600" fill="white">2</text><g id="phone"><rect x="522" y="610" width="445" height="690" rx="62" fill="#202326"/><rect x="536" y="624" width="417" height="662" rx="50" fill="#F8F9F9"/><rect x="657" y="637" width="172" height="25" rx="12" fill="#202326"/><rect x="731" y="737" width="183" height="65" rx="20" fill="#006DFF"/><text x="756" y="780" font-family="Open Sans" font-size="31" font-weight="600" fill="white">Хорошо</text><rect x="567" y="842" width="339" height="123" rx="20" fill="#E1E4E8"/><text x="591" y="889" font-family="Open Sans" font-size="30" font-weight="400" fill="#111511">Посмотри, что</text><text x="591" y="935" font-family="Open Sans" font-size="30" font-weight="400" fill="#111511">прислали</text></g></g><g id="marker-symbols" fill="none" stroke="#5A7E18" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M455 583 q43 -32 89 -8 M530 559 l16 20 -28 3"/></g><g id="footer"><rect x="0" y="1402" width="1086" height="46" fill="#E1E3DF"/><text x="76" y="1433" font-family="Open Sans" font-size="24" font-weight="600" fill="#111511">02 / 07</text><text x="674" y="1433" font-family="Open Sans" font-size="24" font-weight="400" fill="#111511">МИМ · system-school.ru</text></g></svg>