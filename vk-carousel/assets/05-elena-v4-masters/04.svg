<svg xmlns="http://www.w3.org/2000/svg" width="1086" height="1448" viewBox="0 0 1086 1448"><title>Елена v4 · 4/7</title><g id="background"><rect width="1086" height="1448" fill="#242629"/></g><g id="headline"><text x="76" y="132" font-family="Open Sans" font-size="68" font-weight="700" fill="#F5F6F7">Сначала разберусь</text><text x="76" y="224" font-family="Open Sans" font-size="68" font-weight="700" fill="#AFDD2D">с вниманием.</text></g><g id="body-text"><text x="76" y="314" font-family="Open Sans" font-size="38" font-weight="400" fill="#F5F6F7">Елена замечает, что отвлеклась, и ищет совет.</text><text x="76" y="368" font-family="Open Sans" font-size="38" font-weight="400" fill="#F5F6F7">Теперь у неё новая задача: сначала разобраться,</text><text x="76" y="422" font-family="Open Sans" font-size="38" font-weight="400" fill="#F5F6F7">как вернуться к прежней. Поиск решения</text><text x="76" y="476" font-family="Open Sans" font-size="38" font-weight="400" fill="#F5F6F7">становится ещё одной остановкой.</text></g><g id="interfaces"><rect x="76" y="753" width="934" height="140" rx="24" fill="#F5F6F7"/><circle cx="128" cy="817" r="19" stroke="#20252B" stroke-width="5" fill="none"/><path d="M143 833 l19 19" stroke="#20252B" stroke-width="5"/><text x="195" y="838" font-family="Open Sans" font-size="42" font-weight="400" fill="#111511">как перестать отвлекаться</text></g><g id="marker-symbols" fill="none" stroke="#AFDD2D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M790 1010 q-240 110 -470 32 M343 1018 l-26 25 30 20"/></g><g id="footer"><rect x="0" y="1402" width="1086" height="46" fill="#242629"/><text x="76" y="1433" font-family="Open Sans" font-size="24" font-weight="600" fill="#F5F6F7">04 / 07</text><text x="674" y="1433" font-family="Open Sans" font-size="24" font-weight="400" fill="#F5F6F7">МИМ · system-school.ru</text></g></svg>